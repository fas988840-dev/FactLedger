name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin the package manager to the version that generated package-lock.json.
      # npm 10 fails `npm ci` against this lock ("Missing: utf-8-validate@5.0.10
      # from lock file") and its resolver crashes on the vitest 4 upgrade path.
      - name: Pin npm version
        run: npm install -g npm@11 --no-audit --no-fund

      - run: npm ci --no-audit --no-fund

      - name: Audit dependencies (high and critical)
        run: timeout 120s npm audit --audit-level=high

      - name: Audit production dependencies (high and critical)
        run: timeout 120s npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        env:
          FACTLEDGER_API_URL: http://127.0.0.1:3001
          FACTLEDGER_API_KEY: ci-placeholder-only
        run: npm run build
