name: Live Verification

# Runs automatically after a successful deploy to Fly.io/Render,
# or manually via workflow_dispatch with the deployed URL.
#
# Optional GitHub Secrets (Settings → Secrets → Actions):
#   FACTLEDGER_API_URL   — overrides the canonical Render URL
#   FACTLEDGER_API_KEY   — enables credentialed protected-route checks
#   SOLANA_RPC_URL       — optional; defaults to public mainnet-beta endpoint
#
# The job does NOT require CHAINGPT_API_KEY — it only checks the /explanation
# endpoint's fallback path (deterministic summary) to avoid spending credits.
#
# Diagnostics: each check captures the HTTP status AND response body even on
# failure (no `curl -f`, which would hide both), so a non-200 from the live
# API is reported with its actual error text instead of an opaque exit code.
# A warm-up loop first wakes Render free-tier services, which cold-start in
# ~30-60s after 15 min of inactivity — longer than a single request timeout.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Deployed API base URL (overrides FACTLEDGER_API_URL secret)'
        required: false
        type: string
  workflow_run:
    workflows: ['Deploy to Fly.io', 'Deploy to Render']
    types: [completed]

jobs:
  live-verify:
    name: Live smoke tests
    runs-on: ubuntu-latest
    # On workflow_run trigger, only run if the deploy succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      API_URL: ${{ inputs.api_url || secrets.FACTLEDGER_API_URL || 'https://factledger-api.onrender.com' }}
      API_KEY: ${{ secrets.FACTLEDGER_API_KEY }}
      SOLANA_RPC:  ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
      # Use a well-known read-only address: Solana System Program
      TEST_WALLET: '11111111111111111111111111111112'

    steps:
      - name: Print verification target
        run: |
          echo "Testing against: $API_URL"
          if [ -z "$API_KEY" ]; then
            echo "No FACTLEDGER_API_KEY secret is configured; protected-route checks will verify 401 enforcement instead."
          else
            echo "FACTLEDGER_API_KEY is configured; credentialed protected-route checks are enabled."
          fi

      # ── 0. Warm up: wake a cold-started Render free-tier service ────────────
      # A free instance spins down after 15 min idle and takes ~30-60s to wake.
      # Retry /health with a generous per-attempt timeout until it answers 200
      # (or attempts are exhausted) so the real checks below hit a live server.
      - name: Warm up (tolerate Render cold start)
        run: |
          echo "Warming up $API_URL — Render free tier can cold-start for ~30-60s..."
          AWAKE=0
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/warm.json -w "%{http_code}" --max-time 30 \
              "$API_URL/api/v1/health" || echo "000")
            echo "  attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              AWAKE=1
              echo "✅ service is awake"
              break
            fi
            sleep 10
          done
          if [ "$AWAKE" != "1" ]; then
            echo "::warning::Service did not return 200 within warm-up window; checks below will report the real status."
          fi

      # ── 1. Health check ────────────────────────────────────────────────────
      - name: Health check
        run: |
          CODE=$(curl -s --max-time 20 \
            -o /tmp/health.json -w "%{http_code}" \
            "$API_URL/api/v1/health" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"; cat /tmp/health.json 2>/dev/null; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Health check returned $CODE"
            exit 1
          fi
          echo "✅ /api/v1/health → 200"

      # ── 2. Authentication policy ──────────────────────────────────────────
      # A run without the private key is still useful: it must prove that a
      # protected route rejects anonymous requests. When the key exists, the
      # credentialed checks below exercise the protected API end to end.
      - name: Authentication policy
        run: |
          if [ -n "$API_KEY" ]; then
            echo "✅ credentialed route checks enabled"
            exit 0
          fi

          CODE=$(curl -s --max-time 20 \
            -o /tmp/auth.json -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/intelligence" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"; cat /tmp/auth.json 2>/dev/null; echo
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected anonymous protected request to return 401, got $CODE"
            exit 1
          fi
          echo "✅ anonymous protected request → 401"

      # ── 3. Wallet intelligence ─────────────────────────────────────────────
      - name: Wallet intelligence (System Program)
        if: ${{ env.API_KEY != '' }}
        run: |
          CODE=$(curl -s --max-time 60 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/intel.json -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/intelligence" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"
          python3 -m json.tool --no-ensure-ascii /tmp/intel.json 2>/dev/null || cat /tmp/intel.json 2>/dev/null
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Wallet intelligence returned $CODE (see body above for the real cause)"
            exit 1
          fi
          SCORE=$(python3 -c "import json; print(json.load(open('/tmp/intel.json'))['data']['score'])")
          echo "Intelligence score: $SCORE"
          python3 -c "
          s = float('$SCORE')
          assert 0 <= s <= 100, f'Score {s} out of [0,100]'
          print('✅ score in range')
          "

      # ── 4. Risk assessment ─────────────────────────────────────────────────
      - name: Risk assessment (System Program)
        if: ${{ env.API_KEY != '' }}
        run: |
          CODE=$(curl -s --max-time 60 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/risk.json -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/risk" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"
          python3 -m json.tool --no-ensure-ascii /tmp/risk.json 2>/dev/null || cat /tmp/risk.json 2>/dev/null
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Risk assessment returned $CODE (see body above for the real cause)"
            exit 1
          fi
          LEVEL=$(python3 -c "import json; print(json.load(open('/tmp/risk.json'))['data']['level'])")
          echo "Risk level: $LEVEL"
          python3 -c "
          assert '$LEVEL' in ('low','medium','high'), f'Unexpected level: $LEVEL'
          print('✅ risk level valid')
          "

      # ── 5. Explanation endpoint (deterministic fallback, no ChainGPT key) ─
      - name: Explanation endpoint (deterministic fallback)
        if: ${{ env.API_KEY != '' }}
        run: |
          CODE=$(curl -s --max-time 60 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/explanation.json -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/explanation" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"
          python3 -m json.tool --no-ensure-ascii /tmp/explanation.json 2>/dev/null || cat /tmp/explanation.json 2>/dev/null
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::Explanation returned $CODE (see body above for the real cause)"
            exit 1
          fi
          SOURCE=$(python3 -c \
            "import json; print(json.load(open('/tmp/explanation.json'))['data']['summarySource'])" 2>/dev/null || echo "unknown")
          echo "Summary source: $SOURCE"
          echo "✅ /explanation reachable — summarySource=$SOURCE"

      # ── 6. Validation rejects bad address → 400 ───────────────────────────
      - name: 400 on invalid address
        if: ${{ env.API_KEY != '' }}
        run: |
          CODE=$(curl -s --max-time 20 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/bad.json -w "%{http_code}" \
            "$API_URL/api/v1/wallet/not-a-wallet/intelligence" || echo "000")
          echo "HTTP $CODE"
          echo "--- body ---"; cat /tmp/bad.json 2>/dev/null; echo
          if [ "$CODE" != "400" ]; then
            echo "::error::Expected 400 for invalid address, got $CODE"
            exit 1
          fi
          echo "✅ invalid address → 400"

      # ── 7. Solana RPC connectivity ─────────────────────────────────────────
      - name: Solana mainnet-beta RPC reachability
        run: |
          RESPONSE=$(curl -sf --max-time 15 \
            -X POST "$SOLANA_RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"getSlot","params":[]}')
          echo "RPC response: $RESPONSE"
          SLOT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
          echo "Current slot: $SLOT"
          python3 -c "
          assert int('$SLOT') > 0, 'Slot must be positive'
          print('✅ Solana RPC reachable — slot=$SLOT')
          "

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  Live Verification Summary"
          echo "  API: $API_URL"
          echo "  Wallet: $TEST_WALLET"
          echo "═══════════════════════════════════════"
          for f in health intel risk explanation bad; do
            if [ -f /tmp/$f.json ]; then
              echo "[$f] ✅"
            else
              echo "[$f] ❌ (not reached)"
            fi
          done
          if [ -z "$API_KEY" ]; then
            echo "[auth] ✅ anonymous request rejected; credentialed checks skipped"
          else
            echo "[auth] ✅ credentialed checks enabled"
          fi
