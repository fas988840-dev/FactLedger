# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      SOLANA_RPC_URL:
        type: string
        default: "https://api.mainnet-beta.solana.com"
        description: "Solana Mainnet RPC URL (read-only)"
      FACTLEDGER_API_KEY:
        type: string
        default: ""
        description: "Optional FactLedger Pro/Business API key"
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'tsx', 'src/mcp/server.ts'],
      env: {
        SOLANA_RPC_URL: config.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com',
        FACTLEDGER_API_KEY: config.FACTLEDGER_API_KEY || ''
      }
    })
